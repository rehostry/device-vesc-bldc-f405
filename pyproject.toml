[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehostry-vesc-bldc-f405"
version = "0.0.1"
description = "VESC 100/250 BLDC/FOC motor controller (vedderb/bldc on STM32F405/ChibiOS) as a standalone, pip-installable HALucinator device."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Christopher Wright" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
keywords = ["halucinator", "rehosting", "firmware", "emulation", "vesc", "motor-controller", "stm32", "chibios"]

# Runtime deps for the standalone CLI + web panel. HALucinator itself is a
# runtime dependency too, but it is not on PyPI, so it is NOT listed here --
# install the dev core into the same venv
# (`halucinator[unicorn] @ git+https://github.com/rehostry/halucinator.git@dev`)
# so `sys.executable` / `HAL_PY` reaches it. No `HALUCINATOR_SRC` injection.
dependencies = [
    "pyzmq>=24",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Needed only for the co-simulation binding (rehostry_vesc_bldc_f405.binding.make_device).
orchestrator = ["rehostry-orchestrator"]
dev = ["pytest>=7"]

[project.scripts]
rehostry-vesc-bldc-f405 = "rehostry_vesc_bldc_f405.cli:main"
rehostry-vesc-bldc-f405-panel = "rehostry_vesc_bldc_f405.vesc_panel:main"
rehostry-vesc-bldc-f405-attack = "rehostry_vesc_bldc_f405.attack:main"

# Forward-looking: once HALucinator gains entry-point plugin discovery, installing
# this package will auto-register the device. Harmless until then.
[project.entry-points."halucinator.devices"]
vesc-bldc-f405 = "rehostry_vesc_bldc_f405:VESC_BLDC_F405"

[project.urls]
Homepage = "https://github.com/rehostry/device-vesc-bldc-f405"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the configs (incl. the derived addr map). Firmware bytes are NOT shipped
# by default -- they are .gitignore'd and regenerated by tools/extract_firmware.py.
# ONLY if your firmware is redistributable (document the licences in
# PROVENANCE.md, as device-plc does) add "configs/*.bin", "configs/*.elf" here
# and un-ignore them in .gitignore.
rehostry_vesc_bldc_f405 = ["configs/*.yaml", "configs/logging.cfg"]
