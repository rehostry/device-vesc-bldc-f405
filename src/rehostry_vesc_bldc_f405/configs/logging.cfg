# HALucinator reads `logging.cfg` from the process CWD if one exists
# (hal_log.py), and this device is spawned with CWD == this configs dir, so this
# file is the one that takes effect (playbook §2.42).
#
# The shipped default names only root(=ERROR), halucinator.main and HAL_LOG in
# its `keys=` line, so every `logging.getLogger(__name__)` call inside the core
# resolves to root and is thrown away. That silently suppresses the PC-sample
# histogram, the MMU/abort traces and -- the one that matters most here --
# `inject_irq(N): vector table slot 0x... is zero or unmapped`, which fires
# precisely when an interrupt is being misdirected (playbook §2.111). This
# device injects SysTick and USART3 from a bp_handler, so that warning is the
# difference between a diagnosis and an afternoon.
[loggers]
keys=root,mainmod,halucinator.main,HAL_LOG,halucinator.backends.unicorn_backend

[handlers]
keys=consoleHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=ERROR
handlers=consoleHandler

# `python -m halucinator.main` runs main.py as `__main__`, so the core's
# "Letting Unicorn Run" marker -- printed immediately before the CPU is started,
# and the only positive evidence that it WAS started -- goes to the logger
# "__main__", not to "halucinator.main" below. Without this stanza that logger
# inherits root's ERROR, and on the cores whose CWD branch loads this file with
# `disable_existing_loggers=True` it is disabled outright (raising root's level
# would NOT help: a disabled logger emits nothing at any level). Measured on
# this device before this stanza: a clean, marker-free boot.
# `propagate=0` plus its own handler makes it work on BOTH branches.
[logger_mainmod]
level=INFO
handlers=consoleHandler
propagate=0
qualname=__main__

[logger_halucinator.main]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.main

[logger_HAL_LOG]
level=INFO
handlers=consoleHandler
propagate=0
qualname=HAL_LOG

# The backend's own diagnostics, at WARNING.
#
# WARNING and not INFO, deliberately. The record that §2.111 is about --
# "inject_irq(N): vector table slot 0x... is zero or unmapped", which fires
# exactly when an interrupt is being misdirected -- is logged at WARNING, so it
# still appears. What INFO adds is one line per exception ENTRY and one per
# exception RETURN, and this device delivers an interrupt on every pass through
# ChibiOS' idle thread: measured at INFO, the log grew at 463 KB/s and reached
# 3.5 million lines in eleven minutes, which is both a real slowdown and enough
# noise to hide everything else.
#
# Raise this to INFO when you want the injection trace or HAL_PC_SAMPLE's
# histogram (playbook §2.68) -- both live on this logger.
[logger_halucinator.backends.unicorn_backend]
level=WARNING
handlers=consoleHandler
propagate=0
qualname=halucinator.backends.unicorn_backend

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[formatter_sampleFormatter]
format=%(name)s|%(levelname)s|  %(message)s
